{% extends "base.html" %}

{% block title %}Storefront | TechShop{% endblock %}

{% block content %}
  <div class="row row-cols-1 row-cols-md-3 g-4">
    {% for item in products %}
      <div class="col">
        <div class="card h-100 shadow-sm">
          <img src="{{ item.image }}" class="card-img-top p-3" alt="{{ item.name }}" style="height: 200px; object-fit: contain;">
          <div class="card-body d-flex flex-column">
            <div class="mb-2">
              <span class="badge text-bg-primary">{{ item.category }}</span>
              <span class="badge text-bg-light border text-muted">{{ item.part_number }}</span>
            </div>
            <h5 class="card-title">{{ item.name }}</h5>
            <p class="card-text text-muted small flex-grow-1">{{ item.description }}</p>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <span class="fs-5 fw-bold">${{ "%.2f"|format(item.price) }}</span>
              <span class="text-muted small">{{ item.quantity }} in stock</span>
            </div>
          </div>
          <div class="card-footer bg-transparent border-top-0 pb-3">
            <!-- Standard HTML POST form works with zero JavaScript -->
            <form action="/cart/add/{{ item.id }}" method="POST">
              <button type="submit" class="btn btn-dark w-100">Add to Cart</button>
            </form>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
