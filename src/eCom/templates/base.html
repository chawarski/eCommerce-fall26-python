<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}TechShop{% endblock %}</title>

    <!-- Serving locally from static/css/bootstrap.min.css: -->
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">

    <!-- Your custom CSS overrides (always load AFTER Bootstrap) -->
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet">
  </head>
  <body class="bg-body-tertiary">
    <!-- Pure-CSS Navbar (avoid JS-dependent hamburger collapse toggles) -->
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container d-flex justify-content-between align-items-center">
        <a class="navbar-brand fw-bold" href="/">⚡ TechShop</a>
        <div class="d-flex gap-3">
          <a class="nav-link text-light" href="/?category=GPUs">GPUs</a>
          <a class="nav-link text-light" href="/?category=Cellphones">Cellphones</a>
          <a class="nav-link text-light" href="/?category=RAM">RAM</a>
          <a class="nav-link text-light" href="/?category=Accessories">Accessories</a>
        </div>
      </div>
    </nav>

    <main class="container pb-5">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
